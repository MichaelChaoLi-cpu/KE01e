figureDictionary:
  fig_compound_hazard_decision_pathway:
    figureId: fig_compound_hazard_decision_pathway
    figurePath: data/results/figures/Figure_compound_hazard_decision_pathway.png
    figureCaption: Compound-hazard pathway from rainfall to intervention priorities
    figureAim: Links official post-earthquake threshold adjustment and rainfall exposure to slope disruption, road
      failure, community isolation, service loss, and intervention choice across the central question and all supporting
      questions.
    figureExplanation: Explains the ordered evidence chain and the validation gates separating scenario inputs,
      slope and road disruption, network consequences, and decision screening.
    figurePanelCount: 1
    figureSuitableSection: 'Introduction: Conceptual Framework'
  fig_terrain_landslide_evidence_and_emergency_network_context:
    figureId: fig_terrain_landslide_evidence_and_emergency_network_context
    figurePath: data/results/figures/Figure_terrain_landslide_evidence_and_emergency_network_context.png
    figureCaption: Terrain, landslides, warnings, roads, and emergency services
    figureAim: Establishes the spatial evidence base for terrain, interpreted landslides, warning zones, roads,
      emergency routes, shelters, and water points.
    figureExplanation: Maps elevation, interpreted 2016 landslides, official warning zones, emergency roads, shelters,
      and resolved water points with common geographic framing.
    figurePanelCount: 4
    figureNote: >
      Panel a maps elevation and interpreted landslide locations; panel b maps official
      steep-slope, debris-flow, and landslide warning zones; panel c maps the analysis-
      eligible road network and primary and secondary emergency roads; panel d maps
      designated shelters and the subset of emergency water points with resolved locations.
    figureSuitableSection: 'Methods: Study Area and Data'
  fig_rainfall_history_and_official_threshold_adjustment:
    figureId: fig_rainfall_history_and_official_threshold_adjustment
    figurePath: data/results/figures/Figure_rainfall_history_and_official_threshold_adjustment.png
    figureCaption: Historical rainfall and post-earthquake threshold scenarios
    figureAim: Shows station rainfall history, cumulative rainfall, Moderate, Heavy, and Extreme scenarios, and
      official 70 percent and 80 percent threshold retention settings for the threshold-adjustment question.
    figureExplanation: Shows station histories, empirical accumulation-window quantiles, official spatial threshold
      factors, and their effect on relative rainfall loading.
    figurePanelCount: 4
    figureNote: >
      Panel a compares annual maximum 24-hour rainfall across the selected monitoring
      stations; panel b reports Moderate, Heavy, and Extreme empirical rainfall quantiles
      by accumulation window; panel c maps official threshold-retention settings; panel d
      shows how baseline, central, and high threshold adjustments change relative rainfall loading.
    figureSuitableSection: 'Methods: Rainfall Scenarios'
  fig_official_threshold_adjusted_landslide_disruption_score:
    figureId: fig_official_threshold_adjusted_landslide_disruption_score
    figurePath: data/results/figures/Figure_official_threshold_adjusted_landslide_disruption_score.png
    figureCaption: Validated landslide disruption scores across rainfall scenarios
    figureAim: Compares baseline and rainfall-scenario slope disruption scores while retaining score-based language
      unless event labels support probability calibration.
    figureExplanation: Displays the validation-selected transparent score under baseline, Moderate, Heavy, and Extreme
      rainfall while retaining score-based interpretation.
    figurePanelCount: 4
    figureNote: >
      Panel a shows the Heavy-rainfall score under the baseline threshold and overlays
      interpreted landslides; panels b and c show Moderate and Heavy rainfall under the
      official threshold settings; panel d shows the Extreme-rainfall score, all on the
      same relative disruption-score scale.
    figureSuitableSection: 'Results: Slope Disruption'
  fig_road_disruption_exposure_and_observed_restriction_evidence:
    figureId: fig_road_disruption_exposure_and_observed_restriction_evidence
    figurePath: data/results/figures/Figure_road_disruption_exposure_and_observed_restriction_evidence.png
    figureCaption: Road disruption scores and observed restriction evidence
    figureAim: Maps road disruption exposure under rainfall scenarios and compares it with observed rockfall, slope-collapse,
      and sediment-inflow restriction evidence.
    figureExplanation: Maps directional upslope road scores and compares their rankings with independently reported
      landslide-related restriction evidence.
    figurePanelCount: 4
    figureNote: >
      Panels a, b, and c map relative road disruption scores under Moderate, Heavy, and
      Extreme rainfall, with the Extreme panel also identifying emergency transport roads;
      panel d overlays deduplicated landslide-related restriction evidence on the Heavy-
      rainfall score and summarizes matching and ranking correspondence.
    figureSuitableSection: 'Results: Road Disruption'
  fig_community_isolation_frequency_and_exposed_population:
    figureId: fig_community_isolation_frequency_and_exposed_population
    figurePath: data/results/figures/Figure_community_isolation_frequency_and_exposed_population.png
    figureCaption: Community isolation frequency and exposed population
    figureAim: Shows community isolation frequency and affected total and older populations under each disruption
      scenario.
    figureExplanation: Shows simulated community isolation, total and older population exposure, convergence, target-definition
      sensitivity, and ordered rainfall effects.
    figurePanelCount: 4
    figureNote: >
      Panels a, b, and c map community isolation frequency weighted by total population
      under Moderate, Heavy, and Extreme rainfall; panel b also reports simulation and
      target-definition sensitivity; panel d maps age-65-and-older exposure under Extreme
      rainfall using the same conditional isolation-frequency scale.
    figureSuitableSection: 'Results: Community Isolation'
  fig_basic_service_reachability_loss:
    figureId: fig_basic_service_reachability_loss
    figurePath: data/results/figures/Figure_basic_service_reachability_loss.png
    figureCaption: Basic-service reachability loss under road disruption
    figureAim: Shows class-specific loss of reachability to shelters, fire services, and municipal facilities, together
      with excess travel time where routes remain available; emergency water is a conditional sensitivity for 10
      of 36 geolocated destinations.
    figureExplanation: Maps any-same-class service-loss frequencies and reports excess travel time to the nearest
      remaining same-class facility; the hatched emergency-water estimate is excluded from the primary cross-service
      interpretation.
    figurePanelCount: 4
    figureNote: >
      Panels a, b, and c map Heavy-rainfall reachability loss for shelters, fire services,
      and municipal facilities; panel d compares expected affected population and median
      excess travel time and marks emergency water as conditional sensitivity evidence for
      the 10 of 36 geolocated destinations. A community loses a service class only when no
      resolved, road-attached facility in that class remains reachable; the baseline-nearest
      destination is not fixed after disruption.
    figureSuitableSection: 'Results: Service Consequences'
  fig_intervention_priorities_and_budgeted_benefits:
    figureId: fig_intervention_priorities_and_budgeted_benefits
    figurePath: data/results/figures/Figure_intervention_priorities_and_budgeted_benefits.png
    figureCaption: Intervention priorities and benefits across planning budgets
    figureAim: Identifies assigned-action road priorities and total-population community priorities and shows how
      five-seed protected population changes with budget under setting-matched cost-effect assumptions and comparator
      rankings.
    figureExplanation: Maps assigned-action road and community priorities, reports five-seed budget curves, and shows
      that the Central assigned-action and equal-cost consequence rankings yield the same protected population.
    figurePanelCount: 4
    figureNote: >
      Panel a maps ranked road-access intervention priorities; panel b maps community
      resource-pre-positioning priorities with marker size representing isolation burden
      and color representing older-population share; panel c compares five-seed protected
      population across budgets and sensitivity settings; panel d compares the Central
      assigned-action portfolio with setting-matched baselines at maximum budget.
    figureSuitableSection: 'Results: Intervention Priorities'
tableDictionary:
  table_analytical_data_coverage_and_quality:
    tableId: table_analytical_data_coverage_and_quality
    tablePath: data/results/tables/Table_analytical_data_coverage_and_quality.xlsx
    tableCaption: Analytical data coverage and quality
    tableAim: Documents completeness, temporal coverage, spatial support, and interpretation limits for each analytical
      layer.
    tableExplanation: Documents record counts, support, temporal coverage, missingness, location completeness, analytical
      role, and interpretation limits for every input layer.
    tableSuitableSection: 'Appendix A: Analytical Data Coverage'
  table_rainfall_and_threshold_scenarios:
    tableId: table_rainfall_and_threshold_scenarios
    tablePath: data/results/tables/Table_rainfall_and_threshold_scenarios.xlsx
    tableCaption: Rainfall and official threshold scenarios
    tableAim: Defines the combinations of Moderate, Heavy, and Extreme rainfall with baseline, 70 percent, and 80
      percent threshold-retention settings.
    tableExplanation: Defines all rainfall quantiles, accumulation-window values, antecedent rainfall summaries,
      threshold-retention settings, and scenario interpretation boundaries.
    tableSuitableSection: 'Methods: Rainfall Scenarios'
  table_hazard_validation:
    tableId: table_hazard_validation
    tablePath: data/results/tables/Table_hazard_validation.xlsx
    tableCaption: Hazard validation
    tableAim: Compares the pre-specified transparent score and diagnostic alternatives using spatial validation.
    tableExplanation: Reports spatial folds, AUC, inventory capture, ranking stability, and interpretation boundaries
      for selected and comparator hazard specifications.
    tableSuitableSection: 'Appendix B: Landslide Disruption Score Validation'
  table_road_disruption_validation:
    tableId: table_road_disruption_validation
    tablePath: data/results/tables/Table_road_disruption_validation.xlsx
    tableCaption: Road-disruption validation
    tableAim: Compares rainfall-scenario road scores and road baselines using matched observed-restriction evidence.
    tableExplanation: Reports matched concordance, section-bootstrap intervals, ranking stability, and interpretation
      boundaries for selected and comparator road scores.
    tableSuitableSection: 'Appendix B: Road-Restriction Correspondence'
  table_spatial_closure_dependence_sensitivity:
    tableId: table_spatial_closure_dependence_sensitivity
    tablePath: data/results/tables/Table_spatial_closure_dependence_sensitivity.xlsx
    tableCaption: Spatial closure-dependence sensitivity
    tableAim: Tests whether positive within-event spatial dependence changes community-isolation means, tails,
      and local priority membership while preserving every road section's marginal closure propensity.
    tableExplanation: Reports the independent reference and 1 km or 3 km Gaussian-copula clusters at rho 0.25
      or 0.50 for all rainfall scenarios, with total and older-population consequences, P95, rank agreement,
      top-30 overlap, and community-frequency changes.
    tableSuitableSection: 'Appendix B: Network Simulation Convergence and Alternative Assumptions'
  table_municipality_isolation_and_service_loss_summary:
    tableId: table_municipality_isolation_and_service_loss_summary
    tablePath: data/results/tables/Table_municipality_isolation_and_service_loss_summary.xlsx
    tableCaption: Municipality isolation and service-loss summary
    tableAim: Summarizes community isolation, exposed population, older population, class-specific service loss,
      and shelter-specific excess travel time for each administrative unit and scenario.
    tableExplanation: Aggregates eligible population, ordered isolation outcomes, any-same-class service-loss
      populations, conditional emergency-water sensitivity, and shelter excess time to municipalities and wards;
      the four service columns explicitly name the any-same-class estimand.
    tableSuitableSection: 'Appendix C: Municipality Isolation and Service-Loss Summary'
  table_service_destination_estimand_comparison:
    tableId: table_service_destination_estimand_comparison
    tablePath: data/results/tables/Table_service_destination_estimand_comparison.xlsx
    tableCaption: Service-destination estimand and rerouting comparison
    tableAim: Compares any-same-class reachability with fixed-baseline-destination continuity under identical
      Heavy-scenario closure draws.
    tableExplanation: Reports source-location coverage, road attachment, baseline eligibility, paired five-seed loss
      means and ranges, rerouting benefit, benefit share, and benefiting-community counts from the validated
      service-destination audit summary.
    tableSuitableSection: 'Appendix B: Service-Destination Estimand and Rerouting Comparison'
  table_priority_road_sections:
    tableId: table_priority_road_sections
    tablePath: data/results/tables/Table_priority_road_sections.xlsx
    tableCaption: Top thirty priority road sections
    tableAim: Lists the 30 road sections with the largest assigned-action consequence-based intervention relevance.
    tableExplanation: Lists reader-facing road priorities, consequence burden, intervention assignment, relative
      planning cost, and assigned-action screening score without internal road identifiers.
    tableSuitableSection: 'Appendix C: Priority Road Sections'
  table_high_isolation_risk_communities:
    tableId: table_high_isolation_risk_communities
    tablePath: data/results/tables/Table_high_isolation_risk_communities.xlsx
    tableCaption: Top thirty high-isolation-risk communities
    tableAim: Lists the 30 communities with the highest Heavy-scenario expected isolated Total Population, using
      expected isolated Population Age 65+ only as a secondary key and separate descriptor.
    tableExplanation: Lists population clusters with their locations, gateway counts, ordered isolation frequencies,
      affected populations, and principal service loss.
    tableSuitableSection: 'Appendix C: High-Isolation-Risk Communities'
  table_intervention_portfolios:
    tableId: table_intervention_portfolios
    tablePath: data/results/tables/Table_intervention_portfolios.xlsx
    tableCaption: Intervention portfolios
    tableAim: Compares budget-feasible intervention portfolios and their protective benefits across sensitivity
      settings.
    tableExplanation: Reports budget-feasible portfolios, action mix, protected populations, overlap, and cost
      efficiency across sensitivity settings.
    tableSuitableSection: 'Appendix B: Intervention Portfolio Robustness'
  table_comparator_robustness:
    tableId: table_comparator_robustness
    tablePath: data/results/tables/Table_comparator_robustness.xlsx
    tableCaption: Comparator robustness
    tableAim: Compares the assigned-action consequence-based screening ranking with hazard-only, emergency-route-only,
      road-class-only, and equal-cost consequence baselines under matched cost-effect settings.
    tableExplanation: Reports comparator-specific budgets, selected roads, realized costs, protected populations,
      avoided isolation shares, and unit-cost benefits.
    tableSuitableSection: 'Appendix B: Intervention Portfolio Robustness'
analysisStructureBrief:
  overview: Seven linked analytical levels translate official rainfall-threshold scenarios and terrain evidence
    into directional road disruption, community isolation, basic-service loss, and budget-constrained intervention
    priorities, with validation and interpretation limits at every transition.
  levels:
  - levelName: Analytical coverage and baseline quality
    levelAim: Establish valid spatial support, topology, population reconciliation, and service attachment before
      scenario modelling.
    inputs:
    - Geometry
    - Observation Time
    - Station ID
    - Road Section ID
    - Network Node ID
    - Mesh Code
    - Total Population
    - Location Resolution Status
    modelOrMethod: Deterministic coverage, missingness, geometry, temporal-range, population-reconciliation, baseline-connectivity,
      and service-attachment checks.
    outputs:
    - Analytical Data Coverage and Quality
    - Terrain, Landslide Evidence, and Emergency Network Context
    interpretation: Only layers passing their declared quality gates enter the scenario chain; unresolved locations
      and baseline-disconnected cases remain explicit rather than being treated as failures.
  - levelName: Rainfall and threshold scenario construction
    levelAim: Translate independent-event station rainfall maxima and official post-earthquake factors into ordered
      scenario loading.
    inputs:
    - Observation Time
    - Hourly Rainfall
    - Station ID
    - Independent Rainfall Event Identifier
    - Independent-Event Maximum Rainfall
    - Rainfall Threshold Retention Factor
    - Municipality or Subarea (Japanese)
    modelOrMethod: Events are separated by 24 complete zero-rainfall hours. Moderate, Heavy, and Extreme use station-specific
      event-maximum quantiles 0.75, 0.90, and 0.99; coarse inverse-distance loading divides the weighted window
      quantiles by the retained official threshold.
    outputs:
    - Rainfall History and Official Threshold Adjustment
    - Rainfall and Threshold Scenarios
    interpretation: Scenarios measure relative rainfall loading at coarse station support; they alter score magnitude
      but near-unity rank correlations preclude a spatial reprioritization or causal earthquake claim.
  - levelName: Terrain and landslide disruption scoring
    levelAim: Construct a stable, interpretable slope-disruption ranking from terrain, warning zones, and scenario
      rainfall.
    inputs:
    - Elevation
    - Terrain Slope
    - Terrain Curvature
    - Hazard Type
    - Rainfall Scenario
    - Rainfall Threshold Retention Factor
    - Landslide Inventory ID
    modelOrMethod: The selected score follows H_i^(r,f)=logit^-1(0.15 Z_i+1.00 S_i+0.35 abs(C_i)+0.75 W_i+gamma
      log X_i^(r,f)), with gamma=1.00 centrally; fitted logistic specifications remain diagnostic comparators.
    outputs:
    - Official-Threshold-Adjusted Landslide Disruption Score
    - Hazard Validation
    interpretation: Within the 57.8% official GSI interpretation footprint, the frozen propagated terrain-context
      score has mean spatial AUC 0.705, fold range 0.550-0.787, and held-out top-quartile capture 0.465 against
      857 presence cells and 8,570 pseudo-background cells using 29,632 warning zones designated by 2016-04-14.
      This is historical alignment of a transparent ranking, not cross-event validation or a landslide occurrence probability.
  - levelName: Directional slope-to-road translation
    levelAim: Identify road sections exposed to hazardous terrain located above and aligned toward the road.
    inputs:
    - Landslide Disruption Score
    - Elevation
    - Geometry
    - Road Section ID
    - Road Category
    - Emergency Route Membership
    - Restriction Reason
    - Matched Road Edge ID
    modelOrMethod: For road e, D_e^(r,f)=sum_{i in U_e}(q_ie H_i^(r,f))/sum_{i in U_e}q_ie, where U_e requires positive
      relief and downhill alignment and q_ie decreases with distance; matched concordance uses controls matched
      on municipality, road class, emergency-route status, and length decile.
    outputs:
    - Road Disruption Exposure and Observed Restriction Evidence
    - Road-Disruption Validation
    interpretation: Matched restrictions support relative screening performance beyond road-length and warning-zone
      comparators, but the road score is not an empirically calibrated closure probability.
  - levelName: Community isolation simulation
    levelAim: Estimate how ordered road-closure scenarios disconnect populated communities from external-road gateways.
    inputs:
    - Road Disruption Score
    - Community ID
    - Network Component ID
    - Total Population
    - Population Age 65+
    - Emergency Route Membership
    modelOrMethod: Closure propensity is p_e,b^(r,f)=g_b(D_e^(r,f)); Community Isolation Frequency is P_hat_iso,c=(1/M)
      sum_m I_c,m with M=1000 central draws and common random numbers across ordered rainfall scenarios.
    outputs:
    - Community Isolation Frequency and Exposed Population
    - High-Isolation-Risk Communities
    - Municipality Isolation and Service-Loss Summary
    interpretation: Frequencies are conditional on the declared closure mapping and external target; 500, 1,000,
      and 2,000 draw convergence plus alternative targets and mappings bound sensitivity.
  - levelName: Basic-service consequence estimation
    levelAim: Measure service disconnection and travel-time penalties among communities that are reachable at baseline.
    inputs:
    - Community ID
    - Shelter ID
    - Water Point Name
    - Fire Facility Name
    - Facility Name
    - Baseline Edge Travel Time (min)
    - Total Population
    modelOrMethod: Service loss is the simulated frequency that no resolved, road-attached same-class facility remains
      reachable. Baseline time is the nearest-facility time, and each disruption draw recomputes the shortest path to
      all destinations in the class. A paired common-random-number audit compares this primary estimand with fixed-
      baseline-destination continuity; excess time uses 100 full weighted-network rerouting draws.
    outputs:
    - Basic Service Reachability Loss
    - Service-Destination Estimand and Rerouting Comparison
    - Municipality Isolation and Service-Loss Summary
    interpretation: Same-class rerouting prevents fixed-destination overstatement but does not represent facility
      operability or capacity. Baseline-unreachable cases are non-evaluable; emergency-water results are conditional
      sensitivity evidence for 10 of 36 geolocated destinations, with indeterminate bias direction.
  - levelName: Robust intervention screening
    levelAim: Rank feasible road-access actions by population protection under budget and parameter uncertainty.
    inputs:
    - Road Disruption Score
    - Community Isolation Frequency
    - Total Population
    - Population Age 65+
    - Intervention Type
    - Intervention Cost
    modelOrMethod: Population-weighted avoided isolation is A_b(x)=sum_c N_c[P_hat_iso,c^base-P_hat_iso,c^int(x)]
      subject to sum_e,a Cost_e,a,b x_e,a<=B. Each candidate road receives one feasible action, and Q_e is the
      median assigned-action consequence proxy per relative cost across sensitivity settings.
    outputs:
    - Intervention Priorities and Budgeted Benefits
    - Priority Road Sections
    - Intervention Portfolios
    - Comparator Robustness
    interpretation: Results are scenario screening priorities, not engineering optima; Central equality with the
      equal-cost consequence baseline is a consistency finding rather than evidence of incremental superiority.
