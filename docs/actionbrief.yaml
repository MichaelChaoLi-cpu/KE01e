doc_type: actionbrief
version: 1.0.0
datasetDictionary:
  jma_hourly_rainfall:
    datasetSourceName: JMA historical hourly rainfall station collection
    datasetDescription: Hourly rainfall observations used to construct independent rainfall events, event-maximum
      accumulation-window quantiles, and rainfall scenarios.
    datasetAttribute: table
    datasetProvider: Japan Meteorological Agency (JMA)
    datasetGenerationInfo: Official station observations concatenated from station-time chunks for the Kumamoto
      study stations, with companion independent-event maxima and scenario-quantile tables.
    datasetPeriod: 2016-01-01 through 2025-12-31
    datasetScale: 526,056 station-hour records; 5,868 station-event records; 36 station-scenario records
    datasetSpatialResolution: Rain-gauge station
    datasetTemporalResolution: Hourly
    datasetPreprocessingInfo: Parsed timestamps in Asia/Tokyo, converted rainfall and quality fields, deduplicated
      station-hour records, identified events separated by 24 complete zero-rainfall hours, computed event maxima,
      and retained rainfall at station support during preprocessing.
  gsi_dem10b_tiles:
    datasetSourceName: GSI DEM10B elevation tile collection
    datasetDescription: Terrain elevation tiles and mosaic used to derive slope, curvature, and upslope road exposure.
    datasetAttribute: raster
    datasetProvider: Geospatial Information Authority of Japan (GSI)
    datasetGenerationInfo: Official DEM10B web tiles decoded with the published elevation rule and mosaicked for
      Kumamoto.
    datasetPeriod: Reference terrain acquired for the 2026 analysis
    datasetScale: 3,304 available tiles from 3,904 scheduled tiles; 196,402,616 valid elevation pixels; 0.000212%
      noncoverage within Kumamoto Prefecture
    datasetSpatialResolution: Approximately 10 m terrain pixels
    datasetTemporalResolution: Static terrain reference
    datasetPreprocessingInfo: Decoded RGB elevations, retained missing tiles explicitly, generated a georeferenced
      mosaic, and recorded tile-level quality statistics.
  designated_shelters_preprocessed:
    datasetSourceName: Designated shelters
    datasetDescription: Mapped designated shelters used as basic-service destinations.
    datasetAttribute: table
    datasetProvider: National and Kumamoto local-government evacuation-facility open data
    datasetGenerationInfo: Official designation points copied from the audited KE01c asset.
    datasetPeriod: Pre-event designation snapshot
    datasetScale: 1,315 shelter records
    datasetSpatialResolution: Individual mapped facility point
    datasetTemporalResolution: Static designation snapshot
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  earthquake_damage_evidence_reference_preprocessed:
    datasetSourceName: Official 2026 earthquake damage evidence registry
    datasetDescription: Official damage statements retained only as event-context evidence.
    datasetAttribute: table
    datasetProvider: FDMA, Kumamoto Prefecture, and Kumamoto City
    datasetGenerationInfo: Official reports were compiled into a record-level registry in the audited KE01c asset.
    datasetPeriod: 2026-07-28 to 2026-08-02 event window
    datasetScale: 9 evidence records
    datasetSpatialResolution: Reported place, municipality, or service area
    datasetTemporalResolution: Irregular official event snapshots
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  emergency_evacuation_sites_preprocessed:
    datasetSourceName: Emergency evacuation sites
    datasetDescription: Mapped evacuation sites with earthquake and large-scale-fire designations.
    datasetAttribute: table
    datasetProvider: National and Kumamoto local-government evacuation-facility open data
    datasetGenerationInfo: Official site points copied from the audited KE01c asset.
    datasetPeriod: Pre-event designation snapshot
    datasetScale: 1,713 site records
    datasetSpatialResolution: Individual mapped facility point
    datasetTemporalResolution: Static designation snapshot
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  emergency_water_points_preprocessed:
    datasetSourceName: Current emergency water points
    datasetDescription: Announced water-point names, schedules, limits, and resolved locations used in service routing.
    datasetAttribute: table
    datasetProvider: Yatsushiro City, Uki City, and Hikawa Town official emergency notices
    datasetGenerationInfo: Official event notices were extracted with record-level provenance and deterministic
      facility matching.
    datasetPeriod: 2026-07-29 to 2026-08-08
    datasetScale: 36 announced water points; 10 resolved locations
    datasetSpatialResolution: Individual announced facility point when resolved
    datasetTemporalResolution: Event schedule snapshots
    datasetPreprocessingInfo: Preserved unresolved locations, retained only resolved points for routing, and reported
      resulting service estimates as conditional sensitivity evidence with indeterminate bias direction.
  gsi_airphoto_interpreted_landslides:
    datasetSourceName: GSI 2016 air-photo-interpreted landslides
    datasetDescription: Interpreted mass-movement centre points used as incomplete presence evidence for footprint-bounded
      historical alignment of the persistent terrain-context ranking.
    datasetAttribute: other
    datasetProvider: Geospatial Information Authority of Japan (GSI)
    datasetGenerationInfo: Official KML placemarks were parsed into point records with size classes, source-photo
      acquisition intervals, the inventory update date, and source provenance.
    datasetPeriod: Air photographs acquired 2016-04-16 to 2016-07-24; inventory updated 2016-07-28
    datasetScale: 1,044 interpreted landslide points
    datasetSpatialResolution: Mapped centre point within an official interpretation footprint covering 57.8% of Kumamoto Prefecture
    datasetTemporalResolution: Single interpreted inventory
    datasetPreprocessingInfo: Parsed KML points and source-photo timing, assigned stable inventory identifiers, retained
      source size classes, distinguished the update date from observation timing, and did not create absence labels.
  kumamoto_administrative_areas_preprocessed:
    datasetSourceName: MLIT National Land Numerical Information N03 administrative areas
    datasetDescription: Municipality and ward polygons used for spatial linkage, threshold assignment, and reporting.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Official N03 boundaries copied from the audited KE01b asset.
    datasetPeriod: 2025-01-01 boundary reference
    datasetScale: 49 municipality or ward records
    datasetSpatialResolution: Municipality or ward polygon
    datasetTemporalResolution: Single boundary reference date
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  kumamoto_emergency_transport_roads_2024_preprocessed:
    datasetSourceName: MLIT National Land Numerical Information N10 emergency transport roads
    datasetDescription: Official emergency-route lines used to define gateway targets and network strata.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Official N10 route features copied from the audited KE01b asset.
    datasetPeriod: 2024 reference
    datasetScale: 264 route features
    datasetSpatialResolution: Emergency transport route line
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  kumamoto_evacuation_facilities_2012_preprocessed:
    datasetSourceName: MLIT National Land Numerical Information evacuation facilities
    datasetDescription: Evacuation facilities used as reference destinations and location anchors.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Official facility records copied from the audited KE01b asset.
    datasetPeriod: 2012 reference
    datasetScale: 1,969 facility records
    datasetSpatialResolution: Individual facility point
    datasetTemporalResolution: Single historical cross-section
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  kumamoto_fire_stations_2012_preprocessed:
    datasetSourceName: MLIT National Land Numerical Information P17 fire stations
    datasetDescription: Fire stations, branches, and outposts used as basic emergency-service destinations.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Official P17 fire-facility points copied from the audited KE01b asset.
    datasetPeriod: 2012 reference
    datasetScale: 94 fire-facility records
    datasetSpatialResolution: Individual fire-facility point
    datasetTemporalResolution: Single historical cross-section
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  kumamoto_landslide_warning_zones_2025_preprocessed:
    datasetSourceName: MLIT National Land Numerical Information A33 landslide warning zones
    datasetDescription: Official warning-zone polygons used as hazard context and model comparators.
    datasetAttribute: table
    datasetProvider: Kumamoto Prefecture and MLIT National Land Numerical Information
    datasetGenerationInfo: Official A33 warning and special-warning polygons copied from the audited KE01b asset.
    datasetPeriod: 2025 reference
    datasetScale: 56,424 warning-zone polygons
    datasetSpatialResolution: Hazard-zone polygon
    datasetTemporalResolution: Reference-year designation
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  kumamoto_mlit_public_offices_halls_preprocessed:
    datasetSourceName: MLIT National Land Numerical Information public offices and halls
    datasetDescription: Public offices and halls used as municipal emergency-service destinations.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Official public-facility points copied from the audited KE01 asset.
    datasetPeriod: 2022 reference
    datasetScale: 1,660 facility records
    datasetSpatialResolution: Individual facility point
    datasetTemporalResolution: Single reference year
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  kumamoto_population_disclosure_groups_preprocessed:
    datasetSourceName: 2020 Population Census disclosure groups
    datasetDescription: Disclosure-group population and older-age totals used without false fine-grid allocation.
    datasetAttribute: table
    datasetProvider: Statistics Bureau of Japan / e-Stat
    datasetGenerationInfo: Official census disclosure groups copied from the audited KE01b asset.
    datasetPeriod: 2020 Population Census
    datasetScale: 36,657 disclosure-group records
    datasetSpatialResolution: Census disclosure group linked to 125 m cells
    datasetTemporalResolution: Single census reference year
    datasetPreprocessingInfo: Retained native disclosure support and did not duplicate suppressed older-population
      values across fine meshes.
  kumamoto_population_mesh_125m_preprocessed:
    datasetSourceName: 2020 Population Census 125 m population mesh
    datasetDescription: Populated meshes used to construct communities and allocate total population exposure.
    datasetAttribute: table
    datasetProvider: Statistics Bureau of Japan / e-Stat
    datasetGenerationInfo: Official census tabulation joined to the Kumamoto 125 m mesh geography in the audited
      KE01b asset.
    datasetPeriod: 2020 Population Census
    datasetScale: 62,945 populated meshes
    datasetSpatialResolution: 125 m population mesh
    datasetTemporalResolution: Single census reference year
    datasetPreprocessingInfo: Retained native disclosure status, standardized geometry, and preserved aggregated-source
      mesh links.
  kumamoto_road_sections_preprocessed:
    datasetSourceName: Kumamoto junction-to-junction road sections
    datasetDescription: Road sections used as disruption, intervention, and reader-facing ranking units.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT N13 road centerlines in KE01b
    datasetGenerationInfo: Continuous same-level edge chains were aggregated between true network junctions.
    datasetPeriod: 2024 source network
    datasetScale: 343,844 road sections
    datasetSpatialResolution: Junction-to-junction road section
    datasetTemporalResolution: Static baseline network
    datasetPreprocessingInfo: Copied the audited KE01b sections immutably and preserved topology, length, travel
      time, route, and eligibility fields.
  kumamoto_routable_road_edges_preprocessed:
    datasetSourceName: Kumamoto grade-aware routable road edges
    datasetDescription: Routable road edges with topology, length, speed, travel time, hazard, and route attributes.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT N13 road centerlines in KE01b
    datasetGenerationInfo: Grade-aware noding and one-metre endpoint snapping created the baseline graph.
    datasetPeriod: 2024 source network
    datasetScale: 390,234 routable road edges
    datasetSpatialResolution: Routable road edge
    datasetTemporalResolution: Static baseline network
    datasetPreprocessingInfo: Copied the audited KE01b network immutably, retained disconnected components, and
      preserved impedance and route attributes.
  kumamoto_routable_road_nodes_preprocessed:
    datasetSourceName: Kumamoto grade-aware routable road nodes
    datasetDescription: Road nodes defining graph topology for connectivity and shortest-path calculations.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT N13 road centerlines in KE01b
    datasetGenerationInfo: Nodes were generated by grade-aware noding of retained road centerlines.
    datasetPeriod: 2024 source network
    datasetScale: 314,391 road nodes
    datasetSpatialResolution: Road-network node
    datasetTemporalResolution: Static baseline network
    datasetPreprocessingInfo: Copied the audited KE01b nodes immutably and retained component and eligibility attributes.
  official_threshold_factors:
    datasetSourceName: MLIT/JMA temporary rainfall-threshold factors
    datasetDescription: Official 70 and 80 percent threshold-retention settings used for scenario adjustment.
    datasetAttribute: table
    datasetProvider: MLIT and Japan Meteorological Agency (JMA)
    datasetGenerationInfo: Municipality and subarea factors were transcribed from the joint official press release.
    datasetPeriod: '2026-07-28'
    datasetScale: 22 municipality or subarea records
    datasetSpatialResolution: Municipality or declared subarea
    datasetTemporalResolution: Single operational announcement
    datasetPreprocessingInfo: Converted percentages to retained fractions, preserved Japanese area labels, and treated
      factors as scenarios rather than probabilities.
  road_restriction_edge_matches_preprocessed:
    datasetSourceName: Road-restriction candidate edge matches
    datasetDescription: Candidate links between reported restrictions and routable edges for validation.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT restrictions and the MLIT-based road network
    datasetGenerationInfo: Restriction geometry and route names were compared with candidate edges using deterministic
      matching rules.
    datasetPeriod: 2026-07-29 to 2026-08-07
    datasetScale: 98,884 candidate-edge rows representing 680 restriction observations
    datasetSpatialResolution: Restriction observation by candidate road edge
    datasetTemporalResolution: Repeated event snapshots
    datasetPreprocessingInfo: Retained match distance, route agreement, candidate count, method, status, and unmatched
      observations.
  road_restrictions_preprocessed:
    datasetSourceName: MLIT 2026 Kumamoto road restrictions
    datasetDescription: Timestamped road restrictions with cause, status, geometry, detour, and isolation attributes.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Official emergency road-information snapshots were extracted with record-level provenance.
    datasetPeriod: 2026-07-29 to 2026-08-07
    datasetScale: 680 snapshot observations across 15 snapshots
    datasetSpatialResolution: Reported restricted segment or point by snapshot
    datasetTemporalResolution: Repeated event snapshots
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
  shelters_current_preprocessed:
    datasetSourceName: Current shelter status records
    datasetDescription: Current shelter occupancy and utility-status observations used as service context.
    datasetAttribute: table
    datasetProvider: Yatsushiro City official shelter status report
    datasetGenerationInfo: Official event records were extracted with URL, file, retrieval time, and record provenance.
    datasetPeriod: Snapshot at 2026-08-06 18:00 JST
    datasetScale: 41 current shelter records
    datasetSpatialResolution: Individual shelter facility
    datasetTemporalResolution: Single event snapshot
    datasetPreprocessingInfo: Assigned readable English variables, validated data types and geometry, preserved
      missing values, and retained source provenance without imputation.
